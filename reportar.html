<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar Animal - Sistema de Rescate y Adopción Animal</title>
</head>
<body>

    <header>
        <h1>Sistema de Rescate y Adopción Animal</h1>
        <p>Registro de nuevos casos de rescate.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reportar.html">Reportar animal</a></li>
            <li><a href="rescates.html">Lista de rescates</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Registrar un animal rescatado</h2>

            <article>
                <h3>Formulario de reporte</h3>

                <form action="#" method="post">
                    <p>
                        <label for="nombre">Nombre provisional del animal:</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </p>

                    <p>
                        <label for="categoria">Categoría:</label>
                        <select id="categoria" name="categoria">
                            <option value="perros">Perros</option>
                            <option value="gatos">Gatos</option>
                            <option value="fauna-silvestre">Fauna Silvestre</option>
                        </select>
                    </p>

                    <p>Urgencia del rescate:</p>

                    <p>
                        <input type="radio" id="alta" name="urgencia" value="alta">
                        <label for="alta">Alta</label>

                        <input type="radio" id="media" name="urgencia" value="media">
                        <label for="media">Media</label>

                        <input type="radio" id="baja" name="urgencia" value="baja">
                        <label for="baja">Baja</label>
                    </p>

                    <p>
                        <label for="descripcion">Descripción del estado del animal:</label>
                        <textarea id="descripcion" name="descripcion" rows="5" cols="40"></textarea>
                    </p>

                    <p>
                        <button type="submit">Registrar animal</button>
                    </p>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <p>Sistema de Rescate y Adopción Animal - 2026</p>
    </footer>

</body>
</html>

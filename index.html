<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Rescate y Adopción Animal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef5f3;
            color: #263b40;
            margin: 0;
            padding: 25px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #245d57;
        }

        .tarjeta {
            background: white;
            padding: 25px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000015;
        }

        label {
            display: block;
            margin-top: 14px;
        }

        input, select, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #b8c9c6;
            font-size: 16px;
        }

        button {
            background: #247d83;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #d4e0dd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #dcece8;
        }
    </style>
</head>

<body>
<div class="contenedor">

    <h1>🐾 Sistema de Rescate y Adopción Animal</h1>
    <p>Registro y seguimiento de animales rescatados.</p>

    <section class="tarjeta">
        <h2>Registrar animal rescatado</h2>

        <form id="formulario">
            <label for="nombre">Nombre del animal:</label>
            <input id="nombre" type="text" required>

            <label for="especie">Especie:</label>
            <select id="especie" required>
                <option value="Perro">Perro</option>
                <option value="Gato">Gato</option>
                <option value="Otro">Otro</option>
            </select>

            <label for="ubicacion">Ubicación del rescate:</label>
            <input id="ubicacion" type="text" required>

            <label for="responsable">Voluntario responsable:</label>
            <input id="responsable" type="text" required>

            <label for="estado">Estado:</label>
            <select id="estado" required>
                <option value="Rescatado">Rescatado</option>
                <option value="En tratamiento">En tratamiento</option>
                <option value="En adopción">En adopción</option>
                <option value="Adoptado">Adoptado</option>
            </select>

            <button type="submit">Registrar animal</button>
        </form>
    </section>

    <section class="tarjeta">
        <h2>Animales registrados</h2>
        <p>Total de animales: <strong id="total">0</strong></p>

        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Especie</th>
                    <th>Ubicación</th>
                    <th>Responsable</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="listaAnimales"></tbody>
        </table>
    </section>

</div>

<script>
    const formulario = document.getElementById("formulario");
    const listaAnimales = document.getElementById("listaAnimales");
    const total = document.getElementById("total");

    let animales = JSON.parse(
        localStorage.getItem("animalesRescatados") || "[]"
    );

    function mostrarAnimales() {
        listaAnimales.innerHTML = "";

        animales.forEach(function(animal) {
            const fila = document.createElement("tr");

            [
                animal.nombre,
                animal.especie,
                animal.ubicacion,
                animal.responsable,
                animal.estado
            ].forEach(function(dato) {
                const celda = document.createElement("td");
                celda.textContent = dato;
                fila.appendChild(celda);
            });

            listaAnimales.appendChild(fila);
        });

        total.textContent = animales.length;
    }

    formulario.addEventListener("submit", function(evento) {
        evento.preventDefault();

        const animal = {
            nombre: document.getElementById("nombre").value.trim(),
            especie: document.getElementById("especie").value,
            ubicacion: document.getElementById("ubicacion").value.trim(),
            responsable: document.getElementById("responsable").value.trim(),
            estado: document.getElementById("estado").value
        };

        animales.push(animal);

        localStorage.setItem(
            "animalesRescatados",
            JSON.stringify(animales)
        );

        mostrarAnimales();
        formulario.reset();

        alert("¡Animal registrado correctamente!");
    });

    mostrarAnimales();
</script>

</body>
</html>
